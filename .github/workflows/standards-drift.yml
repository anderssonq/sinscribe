name: Agent standards drift

# Weekly check of the external standards Sinscribe's agent-facing output is
# based on (src/standards/registry.ts). Opens or updates one issue when a
# tracked source changed; never edits code. See DESIGN.md §5d.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check upstream standards
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pnpm -s standards:check > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md
      - name: Open or update the drift issue
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create standards-drift --color FBCA04 \
            --description "An external agent standard changed upstream" 2>/dev/null || true
          number=$(gh issue list --label standards-drift --state open \
            --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "Agent standards changed upstream" \
              --label standards-drift --body-file report.md
          fi
      - name: Fail on fetch errors
        if: steps.check.outputs.status == '2'
        run: exit 1
